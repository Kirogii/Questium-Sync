name: Questium Sync release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v1.0.1)
        required: true
      staged:
        description: Sign the locally built APK already uploaded to the draft release
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    if: ${{ !inputs.staged }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Verify and build
        env:
          QUESTIUM_SYNC_VERSION: ${{ inputs.tag }}
        run: |
          ./gradlew spotlessCheck
          ./gradlew :app:testReleaseUnitTest --tests '*.QuestiumSyncTest'
          ./gradlew :app:assembleRelease -Penable-updater
      - name: Sign and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SYNC_SIGNING_KEYSTORE_BASE64: ${{ secrets.SYNC_SIGNING_KEYSTORE_BASE64 }}
          SYNC_SIGNING_PASSWORD: ${{ secrets.SYNC_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/questium-sync.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          umask 077
          printf '%s' "$SYNC_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          mkdir -p release-apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          for apk in app/build/outputs/apk/release/*-unsigned.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release-unsigned.apk$/\1/')
            target="release-apk/Questium-Sync-$abi-$TAG.apk"
            "$SIGNER" sign --ks "$KEYSTORE" --ks-key-alias questium-sync --ks-pass env:SYNC_SIGNING_PASSWORD --key-pass env:SYNC_SIGNING_PASSWORD --out "$target" "$apk"
            "$SIGNER" verify "$target"
          done
          sha256sum release-apk/*.apk > release-apk/SHA256SUMS.txt
          gh release view "$TAG" || gh release create "$TAG" --verify-tag --title "Questium Sync $TAG" --notes-file RELEASE_NOTES.md
          gh release upload "$TAG" release-apk/* --clobber
  sign_staged:
    permissions:
      contents: write
    if: inputs.staged
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and sign staged APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SYNC_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SYNC_SIGNING_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SYNC_SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: questium-sync
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = true
          INPUT="Questium-Reader-arm64-v8a-${TAG}-input.apk"
          FINAL="Questium-Reader-arm64-v8a-${TAG}.apk"
          mkdir -p input signed previous
          gh release download "$TAG" --pattern "$INPUT" --dir input
          timeout 240 gh release download v1.0.0 --pattern 'Questium-Sync-arm64-v8a-v1.0.0.apk' --dir previous
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          AAPT="$(dirname "$SIGNER")/aapt"
          BADGING=$("$AAPT" dump badging "input/$INPUT" | sed -n '1p')
          printf '%s\n' "$BADGING"
          [[ "$BADGING" == *"name='app.questium.sync'"* ]]
          [[ "$BADGING" == *"versionCode='2'"* ]]
          [[ "$BADGING" == *"versionName='${TAG#v}'"* ]]
          KEYSTORE="$RUNNER_TEMP/questium-release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          "$SIGNER" sign --v4-signing-enabled false --ks "$KEYSTORE" --ks-key-alias "$SIGNING_KEY_ALIAS" --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD --out "signed/$FINAL" "input/$INPUT"
          "$SIGNER" verify --verbose --print-certs "signed/$FINAL"
          OLD_CERT=$("$SIGNER" verify --print-certs 'previous/Questium-Sync-arm64-v8a-v1.0.0.apk' | awk '/certificate SHA-256 digest:/ && !found {print $NF; found=1}')
          NEW_CERT=$("$SIGNER" verify --print-certs "signed/$FINAL" | awk '/certificate SHA-256 digest:/ && !found {print $NF; found=1}')
          test -n "$OLD_CERT"
          test "$OLD_CERT" = "$NEW_CERT"
          echo "Signing certificate matches the published release: $NEW_CERT"
          (cd signed && sha256sum "$FINAL" > SHA256SUMS.txt)
          gh release upload "$TAG" "signed/$FINAL" signed/SHA256SUMS.txt --clobber
          gh release delete-asset "$TAG" "$INPUT" --yes
