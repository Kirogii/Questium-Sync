name: Questium Sync release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v1.0.1)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Verify and build
        env:
          QUESTIUM_SYNC_VERSION: ${{ inputs.tag }}
        run: |
          ./gradlew spotlessCheck
          ./gradlew :app:testReleaseUnitTest --tests '*.QuestiumSyncTest'
          ./gradlew :app:assembleRelease -Penable-updater
      - name: Sign and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SYNC_SIGNING_KEYSTORE_BASE64: ${{ secrets.SYNC_SIGNING_KEYSTORE_BASE64 }}
          SYNC_SIGNING_PASSWORD: ${{ secrets.SYNC_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/questium-sync.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          umask 077
          printf '%s' "$SYNC_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          mkdir -p release-apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          for apk in app/build/outputs/apk/release/*-unsigned.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release-unsigned.apk$/\1/')
            target="release-apk/Questium-Sync-$abi-$TAG.apk"
            "$SIGNER" sign --ks "$KEYSTORE" --ks-key-alias questium-sync --ks-pass env:SYNC_SIGNING_PASSWORD --key-pass env:SYNC_SIGNING_PASSWORD --out "$target" "$apk"
            "$SIGNER" verify "$target"
          done
          sha256sum release-apk/*.apk > release-apk/SHA256SUMS.txt
          gh release view "$TAG" || gh release create "$TAG" --verify-tag --title "Questium Sync $TAG" --notes-file RELEASE_NOTES.md
          gh release upload "$TAG" release-apk/* --clobber
